services:
  mysql:
    image: mysql:8.4
    container_name: assessment_mysql
    restart: unless-stopped
    ports:
      - "3307:3306"
    environment:
      MYSQL_DATABASE: task_manager
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend/laravel-api
      dockerfile: Dockerfile
    container_name: assessment_backend
    working_dir: /app
    volumes:
      - ./backend/laravel-api:/app
    command: sh -c "php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8000:8000"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend/nextjs-app
      dockerfile: Dockerfile
    container_name: assessment_frontend
    working_dir: /app
    command: sh -c "rm -rf .next && NEXT_TELEMETRY_DISABLED=1 NODE_OPTIONS=--max-old-space-size=4096 npm run build && npm run start -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
